name: Release

# Publishing runs only for version tags. Push a tag whose name matches the versionName in
# app/build.gradle (for example v1.0.0) once main is green. See RELEASING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Check the tag matches the app version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version_name=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" \
            app/build.gradle | head -n 1)
          if [ "${tag#v}" != "$version_name" ]; then
            echo "::error::Tag $tag does not match versionName $version_name in app/build.gradle."
            exit 1
          fi
          echo "Releasing KeyDrop $version_name from tag $tag."

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYDROP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYDROP_KEYSTORE_BASE64 is not set. See RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/keydrop-release.jks"

      - name: Build the signed bundle and APK
        env:
          KEYDROP_KEYSTORE_FILE: ${{ runner.temp }}/keydrop-release.jks
          KEYDROP_KEYSTORE_PASSWORD: ${{ secrets.KEYDROP_KEYSTORE_PASSWORD }}
          KEYDROP_KEY_ALIAS: ${{ secrets.KEYDROP_KEY_ALIAS }}
          KEYDROP_KEY_PASSWORD: ${{ secrets.KEYDROP_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon -PrequireReleaseSigning=true
          testReleaseUnitTest lint bundleRelease assembleRelease

      - name: Audit the signed APK
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          permissions=$("$build_tools/aapt2" dump permissions "$apk")
          echo "$permissions"
          if echo "$permissions" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo "::error::The release APK requests a network permission."
            exit 1
          fi
          "$build_tools/apksigner" verify --min-sdk-version 24 --print-certs "$apk"

      - name: Publish the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p release-assets
          cp app/build/outputs/bundle/release/*.aab release-assets/
          cp app/build/outputs/apk/release/*.apk release-assets/
          cp app/build/outputs/mapping/release/mapping.txt \
            "release-assets/keydrop-${tag#v}-mapping.txt"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "KeyDrop ${tag#v}" --generate-notes --verify-tag
          fi

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/keydrop-release.jks"
