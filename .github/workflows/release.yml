name: Release

# Publishing runs only for version tags. Push a tag whose name matches the versionName in
# app/build.gradle (for example v1.0.0) once main is green. See RELEASING.md.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Check the release source and version
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi

          tag="${GITHUB_REF_NAME}"
          version_name=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" \
            app/build.gradle | head -n 1)
          if [ "${tag#v}" != "$version_name" ]; then
            echo "::error::Tag $tag does not match versionName $version_name in app/build.gradle."
            exit 1
          fi
          echo "Releasing KeyDrop $version_name from tag $tag."

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYDROP_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYDROP_KEYSTORE_BASE64 is not set. See RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/keydrop-release.jks"

      - name: Build the signed bundle and APK
        env:
          KEYDROP_KEYSTORE_FILE: ${{ runner.temp }}/keydrop-release.jks
          KEYDROP_KEYSTORE_PASSWORD: ${{ secrets.KEYDROP_KEYSTORE_PASSWORD }}
          KEYDROP_KEY_ALIAS: ${{ secrets.KEYDROP_KEY_ALIAS }}
          KEYDROP_KEY_PASSWORD: ${{ secrets.KEYDROP_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon -PrequireReleaseSigning=true
          testReleaseUnitTest lint bundleRelease assembleRelease

      - name: Audit the signed APK
        env:
          EXPECTED_CERT_SHA256: ${{ secrets.KEYDROP_UPLOAD_CERT_SHA256 }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          permissions=$("$build_tools/aapt2" dump permissions "$apk")
          echo "$permissions"
          if echo "$permissions" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo "::error::The release APK requests a network permission."
            exit 1
          fi
          signer_output=$("$build_tools/apksigner" verify \
            --min-sdk-version 24 --print-certs "$apk")
          echo "$signer_output"

          if [ -z "${EXPECTED_CERT_SHA256:-}" ]; then
            echo "::error::Secret KEYDROP_UPLOAD_CERT_SHA256 is not set. See RELEASING.md."
            exit 1
          fi
          signer_count=$(printf '%s\n' "$signer_output" | \
            grep -c '^Signer #[0-9][0-9]* certificate SHA-256 digest:' || true)
          if [ "$signer_count" -ne 1 ]; then
            echo "::error::Expected exactly one APK signer, found $signer_count."
            exit 1
          fi
          actual_cert_sha256=$(printf '%s\n' "$signer_output" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | \
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          expected_cert_sha256=$(printf '%s' "$EXPECTED_CERT_SHA256" | \
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          if [ "$actual_cert_sha256" != "$expected_cert_sha256" ]; then
            echo "::error::Release APK was signed by an unexpected certificate."
            exit 1
          fi

      - name: Publish the release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p release-assets
          cp app/build/outputs/bundle/release/*.aab release-assets/
          cp app/build/outputs/apk/release/*.apk release-assets/
          cp app/build/outputs/mapping/release/mapping.txt \
            "release-assets/keydrop-${tag#v}-mapping.txt"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "KeyDrop ${tag#v}" --generate-notes --verify-tag
          fi

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/keydrop-release.jks"
