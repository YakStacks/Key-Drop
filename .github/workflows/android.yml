name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Run unit tests, lint, and release builds
        run: >-
          ./gradlew --no-daemon
          testReleaseUnitTest lint assembleHardenedTest assembleRelease bundleRelease

      - name: Verify the release APK ships no network permission
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk")
          echo "$permissions"
          if echo "$permissions" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo "::error::The release APK requests a network permission."
            exit 1
          fi
