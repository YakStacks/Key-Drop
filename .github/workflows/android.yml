name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run unit tests, lint, and release builds
        run: >-
          ./gradlew --no-daemon
          testReleaseUnitTest lint assembleHardenedTest assembleRelease bundleRelease

      - name: Verify the release APK ships no network permission
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$apk" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          permissions=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$apk")
          echo "$permissions"
          if echo "$permissions" | grep -Eq 'android.permission.(INTERNET|ACCESS_NETWORK_STATE)'; then
            echo "::error::The release APK requests a network permission."
            exit 1
          fi

      # The two steps below exercise the release signing path on every pull request, so a
      # broken signing configuration surfaces here rather than during an actual release tag.
      - name: Verify the build refuses to produce an unsigned release when signing is required
        run: |
          set -euo pipefail
          if ./gradlew --no-daemon -PrequireReleaseSigning=true -q help > "$RUNNER_TEMP/guard.log" 2>&1; then
            echo "::error::-PrequireReleaseSigning=true succeeded without any signing material."
            exit 1
          fi
          if ! grep -q 'Release signing was required' "$RUNNER_TEMP/guard.log"; then
            echo "::error::The build failed for some reason other than the signing guard."
            cat "$RUNNER_TEMP/guard.log"
            exit 1
          fi
          echo "Signing guard rejected the build as expected."

      - name: Verify the release signing configuration produces a signed APK
        env:
          # A throwaway key generated for this job only. It never signs anything that is
          # published; real releases use the keystore secrets in the Release workflow.
          KEYDROP_KEYSTORE_FILE: ${{ runner.temp }}/ci-throwaway.jks
          KEYDROP_KEYSTORE_PASSWORD: ci-throwaway
          KEYDROP_KEY_ALIAS: ci
          KEYDROP_KEY_PASSWORD: ci-throwaway
        run: |
          set -euo pipefail
          keytool -genkeypair -keystore "$KEYDROP_KEYSTORE_FILE" \
            -storepass "$KEYDROP_KEYSTORE_PASSWORD" -keypass "$KEYDROP_KEY_PASSWORD" \
            -alias "$KEYDROP_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=KeyDrop CI throwaway, O=YakStacks, C=US"
          ./gradlew --no-daemon -PrequireReleaseSigning=true assembleRelease bundleRelease
          apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          certs=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --min-sdk-version 24 --print-certs "$apk")
          echo "$certs"
          if ! echo "$certs" | grep -q 'KeyDrop CI throwaway'; then
            echo "::error::The APK was not signed by the configured release keystore."
            exit 1
          fi

      - name: Remove the throwaway keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/ci-throwaway.jks"
